<!DOCTYPE html>
<html>

<head>

    <title>Movie Review Sentiment Analysis</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        textarea {
            width: 95%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .positive {
            font-size: 24px;
            font-weight: bold;
        }

        .negative {
            font-size: 24px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Movie Review Sentiment Analysis</h1>

    <form method="POST">

        <textarea
            name="review"
            placeholder="Enter your movie review here..."
            required>{{ review }}</textarea>

        <br>

        <button type="submit">
            Predict Sentiment
        </button>

    </form>

    {% if sentiment %}

    <div class="result">

        <h2>Prediction Result</h2>

        <p>
            <strong>Review:</strong>
            {{ review }}
        </p>

        <p>
            <strong>Sentiment:</strong>
        </p>

        <div class="{{ sentiment.lower() }}">
            {{ sentiment }}
        </div>

        <p>
            <strong>Confidence:</strong>
            {{ "%.2f"|format(confidence) }}%
        </p>

    </div>

    {% endif %}

</div>

</body>

</html>
